  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M16 5.5A10.5 10.5 0 1 1 6.13 12.4" stroke="#ECEFE6"/>
    <path d="M6.13 12.4 16 5.5" stroke="#7C9E7D"/>
  </g>
</svg>
